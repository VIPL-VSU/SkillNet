name: SkillNet release checks

on:
  push:
    branches:
      - main
      - skillnet-public-release
  pull_request:
    branches:
      - main
      - skillnet-public-release
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-release:
    name: Public release gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out release branch history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install release-check tooling
        run: python -m pip install --upgrade pip uv pyyaml

      - name: Run static release check
        run: python scripts/check_public_release.py --skip-help --verbose

      - name: Run YAML syntax check
        run: python scripts/check_public_release.py --yaml-smoke --skip-help --verbose

      - name: Run history privacy check
        run: python scripts/check_public_release.py --history-smoke --skip-help --verbose

      - name: Run shell syntax check
        run: python scripts/check_public_release.py --require-bash --skip-help --verbose

      - name: Run public Hub reachability check
        run: python scripts/check_public_release.py --hub-smoke --skip-help --verbose --hub-retries 3 --hub-timeout 30

      - name: Run editable install smoke
        run: |
          python scripts/check_public_release.py \
            --install-smoke \
            --install-python "$(python -c 'import sys; print(sys.executable)')" \
            --skip-help \
            --verbose
